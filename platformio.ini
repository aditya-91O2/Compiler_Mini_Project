[platformio]
default_envs = esp32dev

; ---- normal upload over the USB cable ----
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; ---- wireless upload (after the WiFi firmware is on the car) ----
; Join the 'RobotCar' WiFi, then run:  pio run -e esp32dev_ota -t upload
[env:esp32dev_ota]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags = --auth=robot1234
